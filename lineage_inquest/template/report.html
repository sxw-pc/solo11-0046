<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --muted: #5c6b7a;
      --line: #d9e0e7; --accent: #145c7a; --error: #a4262c; --warn: #8a5a00;
      --info: #235c8a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
    header { background: #10384a; color: #fff; padding: 24px 32px; }
    header h1 { margin: 0 0 6px; font-size: 24px; font-weight: 650; }
    header p { margin: 2px 0; color: #d6e6ee; font-size: 13px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      padding: 18px 20px; margin-bottom: 18px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    h3 { margin: 18px 0 8px; font-size: 15px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .metric { border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: #fbfcfd; }
    .metric strong { display: block; font-size: 24px; line-height: 1.1; }
    .metric span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; background: #f3f6f8; }
    code { font: 12px/1.4 "Cascadia Mono", Consolas, monospace; word-break: break-word; }
    .sev { display: inline-block; min-width: 48px; text-align: center; border-radius: 999px;
      padding: 1px 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; }
    .sev-error { color: #fff; background: var(--error); }
    .sev-warn { color: #fff; background: var(--warn); }
    .sev-info { color: #fff; background: var(--info); }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-style: italic; }
    .overridden { border-left: 3px solid var(--accent); padding-left: 10px; }
    details { margin: 2px 0; }
    summary { cursor: pointer; color: var(--accent); }
    ul.plain { margin: 4px 0; padding-left: 20px; }
    .status-supported { color: #1f6b3c; font-weight: 600; }
    .status-unsupported { color: var(--error); font-weight: 600; }
    footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Lineage Inquest</h1>
    <p>Static SQL lineage and contract inquest · {{PROJECT}}</p>
    <p>{{META}}</p>
  </header>
  <main>
{{BODY}}
  </main>
  <footer>Offline report. All styles are inlined; no scripts, fonts, images, or links are fetched.</footer>
</body>
</html>
